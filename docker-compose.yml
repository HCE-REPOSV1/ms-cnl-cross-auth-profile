# docker-compose.yml — ms-cnl-cross-auth-profile (producción)
# Uso: docker compose up -d
#
# Los secretos se cargan desde Vault al arrancar.
# VAULT_TOKEN vive en .env.docker (una sola línea, nunca commitear).
# Actualizar .env.docker cuando se regeneren tokens con vault-init.

services:
  ms-cnl-cross-auth-profile:
    build: .
    env_file:
      - .env.docker
    ports:
      - "10701:10701"
      - "20701:20701"
    environment:
      NODE_ENV: production
      PORT: "10701"
      VAULT_ADDR: "http://host.docker.internal:8200"
      VAULT_SECRET_PATH: "hce/nestjs/cnl-cross-auth-profile"
    volumes:
      - /proyectos/certs:/proyectos/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:10701/auth/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Sesion unica por usuario (HU01) + cache del mac_token — ver MacTokenCacheService.
  # A diferencia de docker-compose.dev.yml, NO expone puerto al host (solo accesible dentro
  # de la red hce-dev) — el mac_token es un credential vivo contra AD, mayor blast-radius
  # que otra infra puntual de este proyecto que si expone puerto en dev.
  # REDIS_PASSWORD debe agregarse a Vault (VAULT_SECRET_PATH de arriba) antes de desplegar
  # esto en produccion — sin password configurado ahi, REDIS_PASSWORD llega vacio y Redis
  # queda sin auth, aceptable en dev pero no en produccion (ver revision de arquitectura).
  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    env_file:
      - .env.docker
    restart: unless-stopped
    volumes:
      - redis-auth-profile-data:/data

volumes:
  redis-auth-profile-data:

networks:
  default:
    name: hce-dev
    external: true
